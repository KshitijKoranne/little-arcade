server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # nginx's bundled mime.types has no entry for .webmanifest, so set it
    # for that one file rather than redefining the whole types block
    # (a `types { }` here would REPLACE the defaults, not extend them).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    # text/html is always gzipped and listing it again is a config warning
    gzip_types        text/css
                      text/javascript
                      application/javascript
                      image/svg+xml
                      application/manifest+json
                      text/markdown;

    # Always re-check the entry point so a redeploy is picked up at once,
    # but let the browser hold on to the assets for a while.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location = /solo.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
    }
    location ~* \.(js|css|svg|png)$ {
        add_header Cache-Control "public, max-age=3600" always;
    }

    add_header X-Content-Type-Options nosniff    always;
    add_header Referrer-Policy        no-referrer always;
    add_header X-Frame-Options        SAMEORIGIN  always;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log off;
}
