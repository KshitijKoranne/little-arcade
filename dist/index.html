                   : U.pick(['haz_rock', 'haz_thorn']);

        /* Hard ceiling on fall speed: 270px / fallMax is the reaction
           budget the child gets, and it must never dip under it. */
        var speed = cfg.fallBase + Math.min(score, cfg.rampCap) * cfg.fallRamp;
        speed = Math.min(speed, cfg.fallMax) + U.rand(-8, 8);

        items.push({
          kind: kind,
          spr: sprite,
          x: U.rand(24, RA.W - 24),
          y: -12,
          vy: speed,
          vx: 0,
          rot: U.rand(-0.4, 0.4),
          spin: U.rand(-2.2, 2.2),
          wob: U.rand(0, Math.PI * 2)
        });
      }

      function loseLife(it) {
        lives--;
        combo = 0;
        hurtFlash = 0.28;
        RA.audio.sfx('hurt');
        RA.fx.shake(4, 0.28);
        RA.fx.burst(it.x, it.y, {
          count: 16, colors: ['#f2705c', '#b83f3a', '#7c88a8'],
          speedMin: 40, speedMax: 130, lift: 30
        });
        if (lives <= 0) endRound();
      }

      function endRound() {
        state = 'over';
        stateT = 0;
        resultStars = score >= 45 ? 3 : score >= 22 ? 2 : 1;
        starsEarned = U.clamp(Math.floor(score / 8) + 1, 1, 8);
        isRecord = RA.save.payout('catch', score, starsEarned);
        if (score >= 30) RA.save.unlock('basket');
        if (goldCount >= 3) RA.save.unlock('goldrush');
        RA.celebrate(resultStars, isRecord);
      }

      return {
        music: 'catch',

        debug: function () {
          return {
            state: state, score: score, lives: lives, combo: combo,
            basketX: Math.round(basketX),
            items: items.map(function (i) {
              return { x: Math.round(i.x), y: Math.round(i.y), kind: i.kind };
            })
          };
        },

        enter: function () {
          t = 0; stateT = 0; state = 'intro';
          best = RA.save.best('catch');
          reset();
        },

        update: function (dt) {
          t += dt; stateT += dt;
          if (hurtFlash > 0) hurtFlash = Math.max(0, hurtFlash - dt);

          if (state === 'play') {
            /* ---- basket ---- */
            var keyed = RA.input.axisX();
            if (keyed) targetX += keyed * 300 * dt;
            if (RA.input.pointer.down || RA.input.pointer.justDown) {
              targetX = RA.input.pointer.x;
            }
            targetX = U.clamp(targetX, BASKET_HALF + 2, RA.W - BASKET_HALF - 2);
            var prev = basketX;
            basketX += (targetX - basketX) * Math.min(1, dt * 15);
            basketVX = (basketX - prev) / Math.max(dt, 0.0001);

            /* ---- wind ---- */
            if (Math.random() < dt * 0.25) windTarget = U.rand(-26, 26);
            wind = U.approach(wind, windTarget, 18 * dt);

            /* ---- spawning ---- */
            if (rainQueue > 0) {
              rainT -= dt;
              if (rainT <= 0) { spawn(true); rainQueue--; rainT = 0.11; }
            } else {
              spawnT -= dt;
              if (spawnT <= 0 && items.length < 16) {
                spawn(false);
                var gap = cfg.spawnBase - Math.min(score, cfg.rampCap) *
                          ((cfg.spawnBase - cfg.spawnMin) / cfg.rampCap);
                spawnT = Math.max(cfg.spawnMin, gap) + U.rand(-0.08, 0.12);
              }
            }

            /* ---- items ---- */
            for (var i = items.length - 1; i >= 0; i--) {
              var it = items[i];
              it.wob += dt * 3;
              it.y += it.vy * dt;
              it.x += (wind * 0.5 + Math.sin(it.wob) * 7) * dt;
              it.rot += it.spin * dt;
              it.x = U.clamp(it.x, 8, RA.W - 8);

              var caught = it.y > BASKET_Y - 12 && it.y < BASKET_Y + 18 &&
                           Math.abs(it.x - basketX) < BASKET_HALF + cfg.catchPad;

              if (caught) {
                items.splice(i, 1);
                if (it.kind === 'bad') { loseLife(it); continue; }

                if (it.kind === 'gold') {
                  goldCount++;
                  var gp = 5 * multiplier();
                  score += gp;
                  combo += 3;
                  RA.audio.sfx('star');
                  RA.fx.popText('+' + gp, it.x, it.y - 8, { color: C.gold, scale: 2 });
                  RA.fx.burst(it.x, it.y, {
                    count: 24, colors: ['#ffd45c', '#fff0bd', '#ffffff'],
                    speedMin: 40, speedMax: 150, lift: 40
                  });
                  RA.fx.shake(3, 0.2);
                } else {
                  var pts = multiplier();
                  score += pts;
                  combo++;
                  RA.audio.sfx('coin');
                  RA.fx.popText('+' + pts, it.x, it.y - 6, {
                    color: pts > 1 ? C.gold : C.cream, scale: pts > 1 ? 2 : 1
                  });
                  RA.fx.burst(it.x, it.y, {
                    count: 8, colors: ['#ffd45c', '#8fe07a', '#ffffff'],
                    speedMin: 20, speedMax: 70, lift: 20
                  });
                }

                if (combo > 0 && combo % 5 === 0 && multiplier() > 1) {
                  RA.fx.popText('X' + multiplier() + ' CHAIN!', RA.W / 2, 74,
                                { color: C.pink, scale: 2 });
                  RA.audio.sfx('powerup');
                }

                if (score >= nextRain) {
                  nextRain += 30;
                  rainQueue = 9; rainT = 0;
                  RA.fx.popText('FRUIT RAIN!', RA.W / 2, 56, { color: C.gold, scale: 3 });
                  RA.audio.sfx('powerup');
                }
                continue;
              }

              if (it.y > GROUND_Y - 2) {
                items.splice(i, 1);
                if (it.kind === 'fruit') {
                  combo = 0;
                  RA.fx.burst(it.x, GROUND_Y - 2, {
                    count: 5, colors: ['#8fe07a', '#3fae5c'],
                    speedMin: 12, speedMax: 44, arcFrom: Math.PI, arcTo: Math.PI * 2
                  });
                }
              }
            }
          }

          if (state === 'count') {
            var prevSec = Math.floor(stateT - dt);
            var nowSec = Math.floor(stateT);
            if (nowSec !== prevSec) {
              RA.audio.sfx(nowSec >= 3 ? 'go' : 'countdown');
            }
            if (stateT >= 3.9) { state = 'play'; stateT = 0; }
          }
        },

        draw: function (ctx) {
          drawOrchard(ctx, t);

          /* falling items */
          for (var i = 0; i < items.length; i++) {
            var it = items[i];
            /* ground shadow so depth reads */
            var d = U.clamp((it.y) / GROUND_Y, 0, 1);
            ctx.globalAlpha = 0.18 * d;
            ctx.fillStyle = '#12132b';
            ctx.fillRect(Math.round(it.x - 4), GROUND_Y - 1, 8, 2);
            ctx.globalAlpha = 1;
            RA.spr.drawC(ctx, it.spr, it.x, it.y, { rotate: it.rot });
          }

          /* basket, tilted by movement */
          var tilt = U.clamp(basketVX / 900, -0.22, 0.22);
          RA.spr.drawC(ctx, 'basket', basketX, BASKET_Y + 4, { rotate: tilt });

          /* ---- HUD ---- */
          ctx.fillStyle = 'rgba(18,19,43,0.62)';
          ctx.fillRect(0, 0, RA.W, 27);

          for (var l = 0; l < maxLives; l++) {
            RA.spr.draw(ctx, l < lives ? 'heart' : 'heart_empty', 6 + l * 11, 10, {});
          }

          RA.font.draw(ctx, score, RA.W / 2, 3, {
            scale: 3, align: 'center', color: C.cream, outline: true, outlineColor: C.ink
          });

          if (multiplier() > 1) {
            RA.font.draw(ctx, 'X' + multiplier(), RA.W / 2 + 42, 7, {
              scale: 2, color: C.gold, outline: true,
              wave: 1, waveTime: t
            });
          }

          RA.font.draw(ctx, 'BEST ' + Math.max(best, score), RA.W - 6, 11, {
            scale: 1, align: 'right', color: C.mist
          });

          /* chain meter, clear of the score */
          if (state === 'play') {
            var into = combo % 5;
            RA.ui.bar(ctx, RA.W / 2 - 30, 29, 60, 4, into / 5,
                      { fill: C.gold, trough: 'rgba(18,19,43,0.6)', back: 'rgba(18,19,43,0.4)' });
          }

          /* wind indicator */
          if (Math.abs(wind) > 6 && state === 'play') {
            var dir = wind > 0 ? 'arrow_r' : 'arrow_l';
            for (var k = 0; k < 3; k++) {
              RA.spr.draw(ctx, dir, RA.W / 2 - 14 + k * 10, 38,
                          { alpha: 0.25 + 0.25 * Math.sin(t * 6 - k) });
            }
          }

          if (hurtFlash > 0) {
            ctx.fillStyle = 'rgba(242,112,92,' + (hurtFlash * 1.6) + ')';
            ctx.fillRect(0, 0, RA.W, RA.H);
          }

          /* ---- states ---- */
          if (state === 'intro') {
            ctx.fillStyle = 'rgba(18,19,43,0.6)';
            ctx.fillRect(0, 0, RA.W, RA.H);
            RA.ui.panel(ctx, 76, 52, 328, 150, { fill: C.ink2, highlight: C.ink3 });
            RA.font.draw(ctx, 'ORCHARD', RA.W / 2, 62, {
              scale: 4, align: 'center', color: C.leaf, outline: true, outlineColor: C.ink
            });
            RA.spr.draw(ctx, 'fruit_apple', 128, 100, { scale: 2 });
            RA.font.draw(ctx, 'CATCH THE FRUIT', 152, 100, { scale: 2, color: C.cream });
            RA.spr.draw(ctx, 'star', 128, 122, { scale: 2 });
            RA.font.draw(ctx, 'GOLD STAR = 5', 152, 122, { scale: 2, color: C.gold });
            RA.spr.draw(ctx, 'haz_rock', 128, 144, { scale: 2 });
            RA.font.draw(ctx, 'DODGE THESE!', 152, 144, { scale: 2, color: C.coral });
            RA.font.draw(ctx, 'SLIDE YOUR FINGER OR USE < >', RA.W / 2, 168, {
              scale: 1, align: 'center', color: C.mist
            });

            RA.ui.begin({ nav: true });
            if (RA.ui.button(ctx, RA.W / 2 - 60, 182, 120, 26, 'PLAY!',
                             { color: C.green, scale: 2 })) {
              state = 'count'; stateT = 0; reset(); RA.audio.sfx('countdown');
            }
            if (RA.ui.button(ctx, 6, 4, 44, 20, '<', { color: C.grape, scale: 1, sound: 'back' })) {
              RA.go('hub');
            }
            RA.ui.end();
            if (RA.input.justPressed('back')) RA.go('hub');

          } else if (state === 'count') {
            RA.ui.countdown(ctx, stateT, 3);

          } else if (state === 'over') {
            var r = RA.ui.results(ctx, {
              t: stateT,
              title: score >= 30 ? 'AMAZING!' : score >= 15 ? 'GREAT!' : 'GOOD TRY!',
              scoreLabel: 'FRUIT CAUGHT',
              score: score,
              stars: resultStars,
              starsEarned: starsEarned,
              record: isRecord,
              lines: goldCount ? ['GOLD STARS: ' + goldCount] : null
            });
            if (r === 'again') { state = 'count'; stateT = 0; reset(); }
            else if (r === 'home') RA.go('hub');

          } else {
            /* small back button during play */
            RA.ui.begin({ nav: false });
            if (RA.ui.button(ctx, 430, 3, 44, 20, '<', { color: C.grape, scale: 1, sound: 'back' })) {
              RA.go('hub');
            }
            RA.ui.end();
            if (RA.input.justPressed('back')) RA.go('hub');
          }
        }
      };
    }
  });

})();

</script>
<script>
/* ===== js/games/memory.js ===== */
/* =====================================================================
   games/memory.js — ANIMAL MATCH

   Flip cards, find the pairs. The board opens with a short "peek" so a
   young player starts with a fair mental picture instead of blind luck,
   and the score rewards remembering rather than speed.
   ===================================================================== */
(function () {
  'use strict';

  var RA = window.RA;
  var U = RA.util;
  var C = RA.C;

  var NAMES = ['EASY', 'MEDIUM', 'HARD'];
  var COLORS = ['#3fae5c', '#f7a72b', '#ef5b93'];

  /* Board sizes come from the age band. Visual working memory is about
     3.5 items at seven rising to ~5.7 in adults, and remembering an item
     AND where it was is harder than either alone — so the boards stay
     below raw span. */
  function levels() {
    var cfg = RA.tune.get('memory');
    return cfg.pairs.map(function (p, i) {
      var cols = p <= 3 ? 3 : p <= 6 ? 4 : p <= 8 ? 4 : 6;
      var rows = Math.ceil((p * 2) / cols);
      return {
        pairs: p, cols: cols, rows: rows,
        name: NAMES[i], color: COLORS[i],
        peek: cfg.peek[i], minCard: cfg.minCard
      };
    });
  }

  /* Card back: a woven pixel pattern, drawn once per size and cached. */
  var backCache = {};
  function cardBack(w, h) {
    var key = w + 'x' + h;
    if (backCache[key]) return backCache[key];
    var cv = U.makeCanvas(w, h);
    var g = cv.getContext('2d');
    g.fillStyle = '#4a2a8f'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#7a4fd1';
    for (var y = 0; y < h; y += 4) {
      for (var x = (y / 4 % 2) * 4; x < w; x += 8) g.fillRect(x, y, 4, 2);
    }
    g.fillStyle = '#b48cf5';
    for (var yy = 2; yy < h; yy += 8) for (var xx = 2; xx < w; xx += 8) g.fillRect(xx, yy, 2, 2);
    g.fillStyle = '#12132b';
    g.fillRect(0, 0, w, 1); g.fillRect(0, h - 1, w, 1);
    g.fillRect(0, 0, 1, h); g.fillRect(w - 1, 0, 1, h);
    backCache[key] = cv;
    return cv;
  }

  RA.registerGame({
    id: 'memory',
    title: 'MATCH',
    color: '#6b3fc0',
    artBg: '#2e2f4a',
    icon: 'an_cat',
    bestLabel: function (b) { return 'BEST ' + b; },

    preview: function (ctx, x, y, w, h, t) {
      RA.bg.sky(ctx, ['#4a2a8f', '#7a4fd1', '#b48cf5'], x, y, w, h);
      var cw = 22, ch = 28;
      for (var i = 0; i < 3; i++) {
        var cx = x + w / 2 + (i - 1) * 30;
        var flip = Math.sin(t * 1.6 + i * 1.4);
        var sx = Math.abs(flip);
        var dw = Math.max(2, Math.round(cw * sx));
        var dx = Math.round(cx - dw / 2), dy = Math.round(y + h / 2 - ch / 2);
        if (flip > 0) {
          ctx.drawImage(cardBack(cw, ch), dx, dy, dw, ch);
        } else {
          ctx.fillStyle = '#12132b'; ctx.fillRect(dx - 1, dy - 1, dw + 2, ch + 2);
          ctx.fillStyle = '#e8ecff'; ctx.fillRect(dx, dy, dw, ch);
          if (dw > 14) {
            ctx.save(); ctx.beginPath(); ctx.rect(dx, dy, dw, ch); ctx.clip();
            RA.spr.drawC(ctx, RA.ANIMALS[i * 3 % RA.ANIMALS.length], cx, dy + ch / 2, {});
            ctx.restore();
          }
        }
      }
    },

    scene: function () {
      var state = 'levels';   // levels | peek | play | won
      var t = 0, stateT = 0;
      var lvl = null, cards = [], cursor = 0;
      var LEVELS = levels(), lvlIndex = 0;
      var first = null, lockT = 0, moves = 0, mistakes = 0, found = 0;
      var elapsed = 0;
      var score = 0, resultStars = 0, starsEarned = 0, isRecord = false;
      var layout = { x: 0, y: 0, cw: 0, ch: 0, gap: 0 };

      function build(levelIndex) {
        LEVELS = levels();
        lvlIndex = levelIndex;
        lvl = LEVELS[levelIndex];
        var chosen = U.shuffle(RA.ANIMALS).slice(0, lvl.pairs);
        var deck = U.shuffle(chosen.concat(chosen));

        /* fit the grid inside the play area */
        var boxX = 30, boxY = 32, boxW = RA.W - 60, boxH = RA.H - 60;
        var gap = 7;
        var cw = Math.floor((boxW - gap * (lvl.cols - 1)) / lvl.cols);
        var ch = Math.floor((boxH - gap * (lvl.rows - 1)) / lvl.rows);
        cw = Math.min(cw, Math.floor(ch * 0.78), 66);
        ch = Math.min(ch, Math.floor(cw / 0.78));
        /* Small fingers need a target roughly double the adult minimum. */
        cw = Math.max(cw, lvl.minCard);
        ch = Math.max(ch, Math.round(lvl.minCard * 1.28));
        var gridW = cw * lvl.cols + gap * (lvl.cols - 1);
        var gridH = ch * lvl.rows + gap * (lvl.rows - 1);
        layout = {
          x: Math.round(boxX + (boxW - gridW) / 2),
          y: Math.round(boxY + (boxH - gridH) / 2),
          cw: cw, ch: ch, gap: gap
        };

        cards = deck.map(function (spr, i) {
          var col = i % lvl.cols, row = Math.floor(i / lvl.cols);
          return {
            spr: spr,
            x: layout.x + col * (cw + gap),
            y: layout.y + row * (ch + gap),
            flip: 1,          // 1 = face up, 0 = face down
            target: 1,
            matched: false,
            pulse: 0,
            wobble: 0,
            appear: -i * 0.035
          };
        });

        first = null; lockT = 0; moves = 0; mistakes = 0; found = 0;
        elapsed = 0; cursor = 0;
        state = 'peek'; stateT = 0;
      }

      function faceUp(c) { return c.target > 0.5; }

      function tryFlip(c) {
        if (lockT > 0 || c.matched || faceUp(c)) return;
        c.target = 1;
        RA.audio.sfx('flip');
        if (!first) { first = c; return; }

        moves++;
        var a = first, b = c;
        first = null;

        if (a.spr === b.spr) {
          lockT = 0.28;
          a.matched = b.matched = true;
          a.pulse = b.pulse = 1;
          found++;
          RA.audio.sfx('match');
          RA.fx.burst(a.x + layout.cw / 2, a.y + layout.ch / 2, {
            count: 12, colors: ['#ffd45c', '#fff0bd', '#ffffff'], speedMin: 20, speedMax: 70
          });
          RA.fx.burst(b.x + layout.cw / 2, b.y + layout.ch / 2, {
            count: 12, colors: ['#ffd45c', '#fff0bd', '#ffffff'], speedMin: 20, speedMax: 70
          });
          RA.fx.popText('PAIR!', (a.x + b.x) / 2 + layout.cw / 2,
                        (a.y + b.y) / 2 + layout.ch / 2 - 10, { color: C.gold, scale: 2 });
          if (found === lvl.pairs) finish();
        } else {
          mistakes++;
          lockT = 0.85;
          a.wobble = 1; b.wobble = 1;
          RA.audio.sfx('wrong');
          hideLater = [a, b];
          hideT = 0.8;
        }
      }

      var hideLater = null, hideT = 0;

      function finish() {
        state = 'won'; stateT = 0;
        var perfectMoves = lvl.pairs;
        var timeBonus = Math.max(0, 60 - Math.floor(elapsed)) * 2;
        score = Math.max(20, lvl.pairs * 120 - (moves - perfectMoves) * 12 - mistakes * 8 + timeBonus);
        resultStars = moves <= perfectMoves * 1.6 ? 3 : moves <= perfectMoves * 2.5 ? 2 : 1;
        starsEarned = U.clamp(lvl.pairs + resultStars * 2, 1, 20);
        isRecord = RA.save.payout('memory', score, starsEarned);
        if (lvl.pairs === 8) RA.save.unlock('sharp');
        if (mistakes === 0) RA.save.unlock('perfect');
        RA.celebrate(resultStars, isRecord);
      }

      return {
        music: 'memory',

        enter: function () { t = 0; stateT = 0; state = 'levels'; cards = []; LEVELS = levels(); },

        update: function (dt) {
          t += dt; stateT += dt;

          for (var i = 0; i < cards.length; i++) {
            var c = cards[i];
            c.appear = Math.min(1, c.appear + dt * 2.2);
            c.flip = U.approach(c.flip, c.target, dt * 5.5);
            if (c.pulse > 0) c.pulse = Math.max(0, c.pulse - dt * 2.2);
            if (c.wobble > 0) c.wobble = Math.max(0, c.wobble - dt * 2.6);
          }

          if (state === 'peek') {
            if (stateT >= lvl.peek) {
              for (var p = 0; p < cards.length; p++) cards[p].target = 0;
              state = 'play'; stateT = 0;
              RA.audio.sfx('whoosh');
            }
          }

          if (state === 'play') {
            elapsed += dt;
            if (lockT > 0) lockT = Math.max(0, lockT - dt);
            if (hideLater) {
              hideT -= dt;
              if (hideT <= 0) {
                hideLater[0].target = 0; hideLater[1].target = 0;
                hideLater = null;
              }
            }

            /* keyboard cursor */
            var moved = 0;
            if (RA.input.justPressed('right')) { cursor++; moved = 1; }
            if (RA.input.justPressed('left')) { cursor--; moved = 1; }
            if (RA.input.justPressed('down')) { cursor += lvl.cols; moved = 1; }
            if (RA.input.justPressed('up')) { cursor -= lvl.cols; moved = 1; }
            if (moved) {
              cursor = (cursor + cards.length) % cards.length;
              RA.audio.sfx('move');
            }
            if (RA.input.justPressed('ok')) tryFlip(cards[cursor]);

            for (var j = 0; j < cards.length; j++) {
              var cc = cards[j];
              if (RA.input.tapped(cc.x, cc.y, layout.cw, layout.ch)) {
                cursor = j;
                tryFlip(cc);
              }
            }
          }
        },

        draw: function (ctx) {
          /* dreamy dithered backdrop */
          RA.bg.sky(ctx, RA.bg.PALETTES.dream);
          RA.bg.stars(ctx, t, { height: RA.H });
          RA.bg.butterflies(ctx, t * 0.5, 2, { top: 210, band: 40, alpha: 0.5 });

          RA.ui.begin({ nav: state === 'levels' });

          if (state === 'levels') {
            RA.font.draw(ctx, 'ANIMAL MATCH', RA.W / 2, 30, {
              scale: 4, align: 'center', color: C.cream,
              outline: true, outlineColor: C.ink, shadow: true, shadowColor: C.plum
            });
            RA.font.draw(ctx, 'FIND THE PAIRS', RA.W / 2, 66, {
              scale: 2, align: 'center', color: C.lilac
            });

            for (var i = 0; i < LEVELS.length; i++) {
              var L = LEVELS[i];
              var bx = RA.W / 2 - 110, by = 92 + i * 40;
              if (RA.ui.button(ctx, bx, by, 220, 32,
                               L.name + '  -  ' + L.pairs + ' PAIRS',
                               { color: L.color, scale: 2 })) {
                build(i);
              }
            }
            RA.font.draw(ctx, 'BEST SCORE ' + RA.save.best('memory'), RA.W / 2, 224, {
              scale: 1, align: 'center', color: C.mist
            });
            if (RA.ui.button(ctx, 6, 4, 44, 20, '<', { color: C.grape, scale: 1, sound: 'back' })) {
              RA.go('hub');
            }
            RA.ui.end();
            if (RA.input.justPressed('back')) RA.go('hub');
            return;
          }

          /* ---- board ---- */
          for (var n = 0; n < cards.length; n++) {
            var c = cards[n];
            if (c.appear <= 0) continue;
            var pop = U.easeOutBack(U.clamp(c.appear, 0, 1));
            var wob = c.wobble > 0 ? Math.sin(c.wobble * 26) * 3 * c.wobble : 0;
            var pulse = c.pulse > 0 ? 1 + Math.sin(c.pulse * 9) * 0.06 * c.pulse : 1;

            var cw = layout.cw * pop * pulse;
            var ch = layout.ch * pop * pulse;
            var cx = c.x + layout.cw / 2 + wob;
            var cy = c.y + layout.ch / 2;

            /* flip: squash horizontally through zero */
            var f = c.flip;
            var sx = Math.abs(Math.cos(Math.PI * (1 - f)));
            var dw = Math.max(1, Math.round(cw * sx));
            var dh = Math.round(ch);
            var dx = Math.round(cx - dw / 2), dy = Math.round(cy - dh / 2);

            ctx.globalAlpha = c.matched ? 0.88 : 1;

            if (f < 0.5) {
              ctx.drawImage(cardBack(layout.cw, layout.ch), dx, dy, dw, dh);
            } else {
              ctx.fillStyle = C.ink;
              ctx.fillRect(dx - 1, dy - 1, dw + 2, dh + 2);
              ctx.fillStyle = c.matched ? '#d8f7c0' : C.paper;
              ctx.fillRect(dx, dy, dw, dh);
              ctx.fillStyle = c.matched ? '#8fe07a' : C.mist;
              ctx.fillRect(dx, dy + dh - 2, dw, 2);
              if (dw > 18) {
                ctx.save();
                ctx.beginPath(); ctx.rect(dx, dy, dw, dh); ctx.clip();
                RA.spr.drawC(ctx, c.spr, cx, cy, { scale: layout.cw > 52 ? 2 : 1.5 });
                ctx.restore();
              }
              if (c.matched) {
                ctx.fillStyle = 'rgba(143,224,122,0.35)';
                ctx.fillRect(dx, dy, dw, dh);
              }
            }
            ctx.globalAlpha = 1;

            if (state === 'play' && n === cursor && RA.ui.keyboardActive) {
              ctx.fillStyle = C.cream;
              var off = Math.floor(t * 14) % 5;
              for (var q = off; q < layout.cw; q += 5) {
                ctx.fillRect(c.x + q, c.y - 3, 3, 1);
                ctx.fillRect(c.x + q, c.y + layout.ch + 2, 3, 1);
              }
            }
          }

          /* ---- HUD ---- */
          ctx.fillStyle = 'rgba(18,19,43,0.6)';
          ctx.fillRect(0, 0, RA.W, 22);
          RA.font.draw(ctx, 'TURNS ' + moves, 8, 8, { scale: 1, color: C.cream });
          RA.font.draw(ctx, 'PAIRS ' + found + '/' + (lvl ? lvl.pairs : 0), RA.W / 2, 8, {
            scale: 1, align: 'center', color: C.cream
          });
          RA.font.draw(ctx, 'OOPS ' + mistakes, RA.W - 60, 8, { scale: 1, color: C.mist });

          if (state === 'peek') {
            RA.font.draw(ctx, 'REMEMBER!', RA.W / 2, RA.H - 22, {
              scale: 3, align: 'center', color: C.gold,
              outline: true, outlineColor: C.ink, wave: 2, waveTime: t
            });
            RA.ui.bar(ctx, RA.W / 2 - 60, RA.H - 8, 120, 5,
                      1 - stateT / lvl.peek, { fill: C.gold });
          }

          if (state === 'won') {
            var r = RA.ui.results(ctx, {
              t: stateT,
              title: mistakes === 0 ? 'PERFECT!' : 'YOU DID IT!',
              scoreLabel: 'SCORE',
              score: score,
              stars: resultStars,
              starsEarned: starsEarned,
              record: isRecord,
              lines: ['TURNS ' + moves + '   TIME ' + Math.floor(elapsed) + 'S']
            });
            if (r === 'again') build(lvlIndex);
            else if (r === 'home') { state = 'levels'; stateT = 0; }
          } else {
            if (RA.ui.button(ctx, 430, 3, 44, 20, '<',
                             { color: C.grape, scale: 1, sound: 'back' })) {
              state = 'levels'; stateT = 0;
            }
            if (RA.input.justPressed('back')) { state = 'levels'; stateT = 0; }
          }
          RA.ui.end();
        }
      };
    }
  });

})();

</script>
<script>
/* ===== js/games/maths.js ===== */
/* =====================================================================
   games/maths.js — BUBBLE MATHS

   Ten questions, four floating bubbles, pop the right one. A wrong tap
   costs nothing but the first-try point: the bubble wobbles and she can
   try again. Streaks of three light up the pond.
   ===================================================================== */
(function () {
  'use strict';

  var RA = window.RA;
  var U = RA.util;
  var C = RA.C;

  /* Reception / Kindergarten works within 10; UK Year 1 and US Grade 1
     both expect addition and subtraction within 20 at six, with fluency
     only expected to 10. Year 3+ moves to two-digit work. */
  var MODE_DEFS = {
    add5:   { name: 'ADDING TO 5',    color: '#3fae5c' },
    add10:  { name: 'ADDING TO 10',   color: '#3fae5c' },
    add20:  { name: 'ADDING TO 20',   color: '#f7a72b' },
    add100: { name: 'BIGGER ADDING',  color: '#2f7fd6' },
    sub10:  { name: 'TAKING AWAY',    color: '#ef5b93' },
    sub20:  { name: 'TAKING AWAY',    color: '#ef5b93' }
  };

  function modes() {
    return RA.tune.get('maths').modes.map(function (id) {
      return { id: id, name: MODE_DEFS[id].name, color: MODE_DEFS[id].color };
    });
  }
  var BUBBLE_COLORS = ['#ef5b93', '#7a4fd1', '#2f7fd6', '#3fae5c'];

  /* Crisp filled circle — no anti-aliasing, one fillRect per scanline. */
  function pixelCircle(ctx, cx, cy, r, color) {
    cx = Math.round(cx); cy = Math.round(cy); r = Math.round(r);
    ctx.fillStyle = color;
    for (var y = -r; y <= r; y++) {
      var w = Math.floor(Math.sqrt(Math.max(0, r * r - y * y)));
      ctx.fillRect(cx - w, cy + y, w * 2 + 1, 1);
    }
  }

  function drawBubble(ctx, cx, cy, r, color, label, opts) {
    opts = opts || {};
    var a = opts.alpha === undefined ? 1 : opts.alpha;
    var prev = ctx.globalAlpha;
    ctx.globalAlpha = prev * a;

    pixelCircle(ctx, cx, cy + 1, r, '#12132b');
    pixelCircle(ctx, cx, cy, r, color);
    pixelCircle(ctx, cx, cy, r - 2, RA.ui.shade(color, 0.12));
    /* rim light bottom-right */
    pixelCircle(ctx, cx + 1, cy + 2, r - 3, RA.ui.shade(color, -0.1));
    /* glossy highlight */
    pixelCircle(ctx, cx - r * 0.35, cy - r * 0.38, Math.max(2, r * 0.24), 'rgba(255,255,255,0.75)');
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.fillRect(Math.round(cx - r * 0.62), Math.round(cy - r * 0.05), 2, 1);

    if (label !== undefined && label !== null) {
      var ns = r >= 20 ? 3 : 2;
      RA.font.draw(ctx, label, cx, cy - Math.round(RA.font.height(ns) / 2), {
        scale: ns, align: 'center', color: C.white,
        outline: true, outlineColor: '#12132b'
      });
    }
    ctx.globalAlpha = prev;
  }

  /* ---------------------------------------------------------- backdrop */
  function drawPond(ctx, t) {
    RA.bg.sky(ctx, ['#1b4a9e', '#2f7fd6', '#63c9f0', '#bff0ff']);

    /* light shafts */
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < 6; i++) {
      var x = ((i * 97 + t * 6) % (RA.W + 120)) - 60;
      ctx.save();
      ctx.translate(x, 0);
      ctx.transform(1, 0, -0.35, 1, 0, 0);
      ctx.fillRect(0, 0, 16, RA.H);
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    /* rising background bubbles */
    for (var b = 0; b < 16; b++) {
      var sp = 9 + (b % 5) * 4;
      var by = RA.H - ((t * sp + b * 63) % (RA.H + 40));
      var bx = 14 + (b * 61) % (RA.W - 28) + Math.sin(t * 1.4 + b) * 5;
      var br = 1 + (b % 3);
      ctx.globalAlpha = 0.22;
      pixelCircle(ctx, bx, by, br, '#ffffff');
      ctx.globalAlpha = 1;
    }

    /* pond floor + weeds */
    var floorY = RA.H - 18;
    ctx.fillStyle = '#1d7a45';
    ctx.fillRect(0, floorY + 6, RA.W, RA.H - floorY);
    ctx.fillStyle = '#3fae5c';
    for (var w = 0; w < RA.W; w += 7) {
      var hgt = 8 + Math.floor(Math.sin(w * 0.4) * 3 + Math.sin(t * 1.6 + w * 0.2) * 2);
      ctx.fillRect(w, floorY + 6 - hgt, 3, hgt);
    }
    ctx.fillStyle = '#8fe07a';
    for (var w2 = 2; w2 < RA.W; w2 += 14) {
      ctx.fillRect(w2 + Math.round(Math.sin(t * 1.2 + w2) * 2), floorY - 2, 2, 8);
    }
  }

  /* ================================================================== */
  RA.registerGame({
    id: 'maths',
    title: 'BUBBLES',
    color: '#1b4a9e',
    artBg: '#2f7fd6',
    icon: 'gem',
    bestLabel: function (b) { return 'BEST ' + b + '/10'; },

    preview: function (ctx, x, y, w, h, t) {
      RA.bg.sky(ctx, ['#1b4a9e', '#2f7fd6', '#63c9f0'], x, y, w, h);
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      for (var i = 0; i < 3; i++) {
        var bx = x + 24 + i * 33 + Math.sin(t * 1.3 + i * 2) * 4;
        var by = y + h / 2 + Math.cos(t * 1.1 + i * 1.7) * 7;
        drawBubble(ctx, bx, by, 12, BUBBLE_COLORS[i], [3, 7, 5][i]);
      }
      ctx.restore();
    },

    scene: function () {
      var state = 'levels';    // levels | play | done
      var t = 0, stateT = 0;
      var mode = modes()[0];
      var TOTAL = RA.tune.get('maths').questions;
      var qIndex = 0, correctFirst = 0, streak = 0, bestStreak = 0;
      var question = '', answer = 0, firstTry = true;
      var bubbles = [], busy = 0, cursor = 0;
      var resultStars = 0, starsEarned = 0, isRecord = false;
      var cheer = 0, cheerText = '';

      var FIELD = { x: 20, y: 74, w: RA.W - 40, h: RA.H - 96 };

      function makeQuestion() {
        var a, b;
        switch (mode.id) {
          case 'add5':
            a = U.randInt(1, 4); b = U.randInt(1, Math.max(1, 5 - a));
            return { text: a + ' + ' + b, ans: a + b };
          case 'add10':
            a = U.randInt(1, 8); b = U.randInt(1, Math.max(1, 10 - a));
            return { text: a + ' + ' + b, ans: a + b };
          case 'add20':
            a = U.randInt(2, 15); b = U.randInt(1, Math.max(1, 20 - a));
            return { text: a + ' + ' + b, ans: a + b };
          case 'add100':
            a = U.randInt(10, 60); b = U.randInt(5, Math.max(5, 99 - a));
            return { text: a + ' + ' + b, ans: a + b };
          case 'sub10':
            a = U.randInt(2, 10); b = U.randInt(1, a);
            return { text: a + ' - ' + b, ans: a - b };
          default:      /* sub20 */
            a = U.randInt(3, 20); b = U.randInt(1, a);
            return { text: a + ' - ' + b, ans: a - b };
        }
      }

      function makeOptions(ans) {
        var set = [ans], guard = 0;
        while (set.length < 4 && guard++ < 300) {
          var d = ans + U.randInt(-4, 4);
          if (d < 0) d = U.randInt(0, 20);
          if (d !== ans && set.indexOf(d) === -1) set.push(d);
        }
        while (set.length < 4) {
          var e = U.randInt(0, 25);
          if (set.indexOf(e) === -1) set.push(e);
        }
        return U.shuffle(set);
      }

      function nextQuestion() {
        if (qIndex >= TOTAL) { finish(); return; }
        firstTry = true; busy = 0; cursor = 0;
        var q = makeQuestion();
        question = q.text + ' = ?';
        answer = q.ans;

        var opts = makeOptions(answer);
        var cellW = FIELD.w / 2, cellH = FIELD.h / 2;
        var r = Math.round(Math.min(cellW, cellH) * 0.34);
        bubbles = opts.map(function (val, i) {
          var col = i % 2, row = Math.floor(i / 2);
          var minX = FIELD.x + col * cellW + r + 4;
          var maxX = FIELD.x + (col + 1) * cellW - r - 4;
          var minY = FIELD.y + row * cellH + r + 4;
          var maxY = FIELD.y + (row + 1) * cellH - r - 4;
          return {
            val: val, r: r, color: BUBBLE_COLORS[i % BUBBLE_COLORS.length],
            x: U.rand(minX, maxX), y: U.rand(minY, maxY),
            vx: U.rand(-14, 14) || 9, vy: U.rand(-11, 11) || 7,
            minX: minX, maxX: maxX, minY: minY, maxY: maxY,
            pop: 0, wob: 0, born: 0
          };
        });
      }

      function choose(b) {
        if (busy > 0 || b.pop > 0) return;
        if (b.val === answer) {
          busy = 0.62;
          b.pop = 0.001;
          RA.audio.sfx('pop');
          RA.audio.sfx('correct');
          RA.fx.burst(b.x, b.y, {
            count: 20, colors: [b.color, '#ffffff', '#bff0ff'],
            speedMin: 30, speedMax: 110
          });
          if (firstTry) {
            correctFirst++;
            streak++;
            bestStreak = Math.max(bestStreak, streak);
            if (streak > 0 && streak % 3 === 0) {
              cheer = 1.2; cheerText = streak + ' IN A ROW!';
              RA.audio.sfx('powerup');
              RA.fx.confetti(28);
            }
          } else {
            streak = 0;
          }
          RA.fx.popText(U.pick(['YES!', 'WELL DONE!', 'CORRECT!', 'SUPER!', 'CLEVER!']),
                        b.x, b.y - 22, { color: C.gold, scale: 2 });
          for (var i = 0; i < bubbles.length; i++) if (bubbles[i] !== b) bubbles[i].pop = 0.001;
          qIndex++;
        } else {
          firstTry = false;
          streak = 0;
          b.wob = 1;
          RA.audio.sfx('wrong');
          RA.fx.popText('TRY AGAIN', b.x, b.y - 20, { color: C.coral, scale: 1 });
        }
      }

      function finish() {
        state = 'done'; stateT = 0;
        resultStars = correctFirst >= 10 ? 3 : correctFirst >= 8 ? 2 : 1;
        starsEarned = U.clamp(correctFirst + resultStars, 1, 15);
        isRecord = RA.save.payout('maths', correctFirst, starsEarned);
        if (correctFirst === TOTAL) RA.save.unlock('brainy');
        RA.celebrate(resultStars, isRecord);
      }

      function start(m) {
        mode = m;
        TOTAL = RA.tune.get('maths').questions;
        qIndex = 0; correctFirst = 0; streak = 0; bestStreak = 0;
        state = 'play'; stateT = 0;
        nextQuestion();
      }

      return {
        music: 'maths',

        enter: function () { t = 0; stateT = 0; state = 'levels'; bubbles = []; },

        update: function (dt) {
          t += dt; stateT += dt;
          if (cheer > 0) cheer = Math.max(0, cheer - dt);

          if (state !== 'play') return;

          if (busy > 0) {
            busy -= dt;
            if (busy <= 0) nextQuestion();
          }

          for (var i = 0; i < bubbles.length; i++) {
            var b = bubbles[i];
            b.born = Math.min(1, b.born + dt * 4);
            if (b.pop > 0) { b.pop += dt * 3.4; continue; }
            if (b.wob > 0) b.wob = Math.max(0, b.wob - dt * 2.6);
            b.x += b.vx * dt; b.y += b.vy * dt;
            if (b.x < b.minX) { b.x = b.minX; b.vx = Math.abs(b.vx); }
            if (b.x > b.maxX) { b.x = b.maxX; b.vx = -Math.abs(b.vx); }
            if (b.y < b.minY) { b.y = b.minY; b.vy = Math.abs(b.vy); }
            if (b.y > b.maxY) { b.y = b.maxY; b.vy = -Math.abs(b.vy); }
          }

          /* keyboard */
          var moved = 0;
          if (RA.input.justPressed('right')) { cursor = (cursor + 1) % 4; moved = 1; }
          if (RA.input.justPressed('left')) { cursor = (cursor + 3) % 4; moved = 1; }
          if (RA.input.justPressed('down')) { cursor = (cursor + 2) % 4; moved = 1; }
          if (RA.input.justPressed('up')) { cursor = (cursor + 2) % 4; moved = 1; }
          if (moved) RA.audio.sfx('move');
          if (RA.input.justPressed('ok') && bubbles[cursor]) choose(bubbles[cursor]);

          if (RA.input.pointer.justDown) {
            for (var j = 0; j < bubbles.length; j++) {
              var bb = bubbles[j];
              if (bb.pop > 0) continue;
              if (U.dist(RA.input.pointer.x, RA.input.pointer.y, bb.x, bb.y) <= bb.r + 4) {
                cursor = j;
                choose(bb);
                break;
              }
            }
          }
        },

        draw: function (ctx) {
          drawPond(ctx, t);
          RA.ui.begin({ nav: state === 'levels' });

          if (state === 'levels') {
            RA.font.draw(ctx, 'BUBBLE MATHS', RA.W / 2, 30, {
              scale: 4, align: 'center', color: C.cream,
              outline: true, outlineColor: C.ink, shadow: true, shadowColor: C.deep
            });
            RA.font.draw(ctx, 'POP THE RIGHT ANSWER', RA.W / 2, 66, {
              scale: 2, align: 'center', color: C.sky
            });
            var MODES = modes();
            for (var i = 0; i < MODES.length; i++) {
              if (RA.ui.button(ctx, RA.W / 2 - 110, 92 + i * 40, 220, 32, MODES[i].name,
                               { color: MODES[i].color, scale: 2 })) start(MODES[i]);
            }
            RA.font.draw(ctx, 'BEST ' + RA.save.best('maths') + ' OUT OF 10', RA.W / 2, 224, {
              scale: 1, align: 'center', color: C.sky
            });
            if (RA.ui.button(ctx, 6, 4, 44, 20, '<', { color: C.grape, scale: 1, sound: 'back' })) {
              RA.go('hub');
            }
            RA.ui.end();
            if (RA.input.justPressed('back')) RA.go('hub');
            return;
          }

          /* ---- HUD ---- */
          ctx.fillStyle = 'rgba(18,19,43,0.6)';
          ctx.fillRect(0, 0, RA.W, 26);
          RA.font.draw(ctx, 'Q ' + Math.min(qIndex + 1, TOTAL) + '/' + TOTAL, 8, 10,
                       { scale: 1, color: C.sky });
          RA.font.draw(ctx, 'RIGHT ' + correctFirst, RA.W - 8, 10,
                       { scale: 1, color: C.gold, align: 'right' });
          RA.ui.bar(ctx, RA.W / 2 - 60, 9, 120, 7, qIndex / TOTAL,
                    { fill: C.leaf, trough: '#1b4a9e' });

          /* ---- question card ---- */
          RA.ui.panel(ctx, RA.W / 2 - 120, 32, 240, 34, { fill: C.ink2, highlight: C.ink3 });
          RA.font.draw(ctx, question, RA.W / 2, 40, {
            scale: 3, align: 'center', color: C.white, outline: true, outlineColor: C.ink
          });

          /* ---- bubbles ---- */
          for (var n = 0; n < bubbles.length; n++) {
            var b = bubbles[n];
            if (b.pop > 0) {
              var k = U.clamp(b.pop, 0, 1);
              drawBubble(ctx, b.x, b.y, b.r * (1 + k * 0.7), b.color, null, { alpha: 1 - k });
              continue;
            }
            var wob = b.wob > 0 ? Math.sin(b.wob * 30) * 4 * b.wob : 0;
            var grow = U.easeOutBack(b.born);
            drawBubble(ctx, b.x + wob, b.y, Math.max(2, b.r * grow), b.color, b.val);

            if (n === cursor && RA.ui.keyboardActive) {
              ctx.fillStyle = C.cream;
              for (var a2 = 0; a2 < 12; a2++) {
                var ang = (a2 / 12) * Math.PI * 2 + t * 1.5;
                ctx.fillRect(Math.round(b.x + Math.cos(ang) * (b.r + 5)),
                             Math.round(b.y + Math.sin(ang) * (b.r + 5)), 2, 2);
              }
            }
          }

          if (cheer > 0) {
            RA.font.draw(ctx, cheerText, RA.W / 2, RA.H / 2 - 6, {
              scale: 4, align: 'center', color: C.gold,
              outline: true, outlineColor: C.ink,
              alpha: U.clamp(cheer * 1.5, 0, 1), wave: 3, waveTime: t
            });
          }

          if (state === 'done') {
            var r = RA.ui.results(ctx, {
              t: stateT,
              title: correctFirst === TOTAL ? 'PERFECT!' : correctFirst >= 8 ? 'BRILLIANT!' : 'NICE WORK!',
              scoreLabel: 'RIGHT FIRST TRY',
              score: correctFirst,
              stars: resultStars,
              starsEarned: starsEarned,
              record: isRecord,
              lines: ['BEST STREAK ' + bestStreak]
            });
            if (r === 'again') start(mode);
            else if (r === 'home') { state = 'levels'; stateT = 0; }
          } else {
            if (RA.ui.button(ctx, 430, 30, 44, 20, '<',
                             { color: C.grape, scale: 1, sound: 'back' })) {
              state = 'levels'; stateT = 0;
            }
            if (RA.input.justPressed('back')) { state = 'levels'; stateT = 0; }
          }
          RA.ui.end();
        }
      };
    }
  });

})();

</script>
<script>
/* ===== js/games/hopper.js ===== */
/* =====================================================================
   games/hopper.js — SKY HOPPER

   Endless vertical jumper. She bounces automatically; the only job is
   steering. There is exactly one way to lose (fall off the bottom),
   which keeps it readable for a six-year-old, and the sky changes from
   morning to space as she climbs, so height feels like progress.
   ===================================================================== */
(function () {
  'use strict';

  var RA = window.RA;
  var U = RA.util;
  var C = RA.C;

  var GRAVITY = 980;
  var JUMP_V = -432;
  var SPRING_V = -720;
  /* Overridden per age band. A young child steers bang-bang — hold left,
     hold right — so a high top speed makes them overshoot the platform
     rather than land on it. Slower is genuinely easier here. */
  var MOVE_ACC = 980;
  var MAX_VX = 215;

  /* How far down the screen the camera holds her. This must leave more
     than one full jump of headroom below her apex, or she can fall past
     the bottom of the screen onto a platform she was standing on. */
  var START_PLAT_Y = 40;

  /* Sky bands she climbs through. */
  var BANDS = [
    RA.bg.PALETTES.meadow,
    RA.bg.PALETTES.day,
    RA.bg.PALETTES.sunset,
    RA.bg.PALETTES.dream,
    RA.bg.PALETTES.night
  ];
  var BAND_HEIGHT = 260;   // metres per band

  function drawPlatform(ctx, p, sx, sy) {
    var w = p.w, h = 8;
    var x = Math.round(sx), y = Math.round(sy);
    /* dark keyline: white clouds on a pale sky need it to stay readable */
    ctx.fillStyle = '#5a6a94';
    ctx.fillRect(x - 1, y - 1, w + 2, h + 2);
    if (p.kind === 'leaf') {
      ctx.fillStyle = '#1d7a45'; ctx.fillRect(x, y + 2, w, h - 2);
      ctx.fillStyle = '#3fae5c'; ctx.fillRect(x, y + 1, w, 4);
      ctx.fillStyle = '#8fe07a'; ctx.fillRect(x + 2, y, w - 4, 2);
      ctx.fillStyle = '#d8f7c0';
      for (var i = 3; i < w - 3; i += 7) ctx.fillRect(x + i, y + 1, 2, 1);
    } else {
      /* cloud */
      ctx.fillStyle = '#c3cde0'; ctx.fillRect(x, y + 3, w, 5);
      ctx.fillStyle = '#e8ecff'; ctx.fillRect(x, y + 1, w, 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 3, y, w - 6, 3);
      ctx.fillRect(x + 8, y - 2, w - 16, 3);
      ctx.fillStyle = '#a8aed8'; ctx.fillRect(x + 1, y + 7, w - 2, 1);
    }
    if (p.kind === 'spring') {
      RA.spr.draw(ctx, 'plat_spring', x + w / 2 - 5, y - 7 - (p.springT > 0 ? 3 : 0), {});
    }
    if (p.kind === 'move') {
      ctx.fillStyle = '#63c9f0';
      ctx.fillRect(x + 2, y + 8, w - 4, 1);
    }
  }

  RA.registerGame({
    id: 'hopper',
    title: 'SKY HOP',
    color: '#2f7fd6',
    artBg: '#9fe4ff',
    icon: 'plat_cloud',
    bestLabel: function (b) { return 'BEST ' + b + 'M'; },

    preview: function (ctx, x, y, w, h, t) {
      RA.bg.sky(ctx, RA.bg.PALETTES.day, x, y, w, h);
      ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
      var scroll = (t * 26) % 26;
      for (var i = -1; i < 4; i++) {
        var py = y + i * 26 + scroll;
        var px = x + 12 + ((i * 53) % (w - 44));
        drawPlatform(ctx, { w: 30, kind: i % 3 === 0 ? 'leaf' : 'cloud' }, px, py);
      }
      var hop = Math.abs(Math.sin(t * 3)) * 12;
      RA.spr.drawC(ctx, 'girl_jump', x + w / 2, y + h - 18 - hop, {});
      ctx.restore();
    },

    scene: function () {
      var state = 'intro';    // intro | play | over
      var t = 0, stateT = 0;
      var cfg = RA.tune.get('hopper');
      var CAM_ANCHOR = cfg.camAnchor;
      var player, plats, pickups, camY, startY, maxUp, best;
      var score = 0, starsGot = 0, resultStars = 0, starsEarned = 0, isRecord = false;
      var topGen = 0, nextId = 0;
      var puffT = 0, rescues = 0, rescueT = 0;

      function reset() {
        cfg = RA.tune.get('hopper');
        CAM_ANCHOR = cfg.camAnchor;
        MAX_VX = cfg.maxVX;
        MOVE_ACC = cfg.moveAcc;
        /* She starts standing ON the first platform, not floating above
           it — otherwise her opening jump peaks higher than one jump's
           worth of headroom and she lands below the camera. */
        player = {
          x: RA.W / 2, y: START_PLAT_Y - 9, vx: 0, vy: JUMP_V,
          w: 12, h: 16, face: 1, frame: 0
        };
        startY = player.y;
        camY = player.y - RA.H * CAM_ANCHOR;
        maxUp = 0;
        score = 0; starsGot = 0;
        rescues = cfg.rescues; rescueT = 0;
        plats = []; pickups = []; nextId = 0;

        /* a wide starter platform right under her */
        plats.push({ id: nextId++, x: RA.W / 2 - 34, y: START_PLAT_Y, w: 68, kind: 'cloud', vx: 0 });
        topGen = START_PLAT_Y;
        while (topGen > camY - 120) generateRow();
      }

      function generateRow() {
        var height = Math.max(0, Math.floor((startY - topGen) / 6));
        /* One bounce lasts 0.88s and tops out at 215px/s, so she can only
           cover ~165px sideways with perfect play. A frame-perfect bot
           still died in 9-13s when this asked for up to 127px, so the
           reach is now well inside what one comfortable bounce buys. */
        var warmUp = height < 60;
        var gap = warmUp ? U.rand(cfg.gapMin - 4, cfg.gapMin + 4)
                         : U.rand(cfg.gapMin, cfg.gapMax + Math.min(cfg.gapGrow, height / 90));
        topGen -= gap;

        var w = warmUp ? Math.round(U.rand(cfg.platMax - 6, cfg.platMax + 10))
                       : Math.round(U.rand(cfg.platMin, cfg.platMax) -
                                    Math.min(8, height / 220));

        /* Every so often, a wide ledge she can hardly miss. It turns a
           bad run into a pause rather than a fall. */
        var isSafety = cfg.safetyEvery > 0 && (nextId % cfg.safetyEvery === 0);
        if (isSafety) w = cfg.safetyW;

        var prev = plats.length ? plats[plats.length - 1] : null;
        var fromX = prev ? prev.x + prev.w / 2 : RA.W / 2;
        var reach = isSafety ? cfg.reachBase * 0.5
                  : warmUp   ? cfg.reachBase * 0.7
                             : cfg.reachBase + Math.min(cfg.reachGrow, height / 40);
        var cx = fromX + U.rand(-reach, reach);
        cx = U.clamp(cx, w / 2 + 6, RA.W - w / 2 - 6);
        var x = cx - w / 2;

        var kind = 'cloud';
        var r = Math.random();
        if (r > 0.86) kind = 'leaf';
        if (height > 120 && r < 0.16) kind = 'move';
        var p = {
          id: nextId++, x: x, y: topGen, w: w, kind: kind,
          vx: kind === 'move' ? (Math.random() < 0.5 ? -1 : 1) * U.rand(22, 42) : 0,
          springT: 0
        };
        if (Math.random() < cfg.springPct && height > 40) p.kind = 'spring';
        plats.push(p);

        if (Math.random() < 0.22) {
          pickups.push({ x: x + w / 2, y: topGen - 16, taken: 0, ph: Math.random() * 6 });
        }
      }

      function die() {
        state = 'over'; stateT = 0;
        resultStars = score >= 600 ? 3 : score >= 250 ? 2 : 1;
        starsEarned = U.clamp(Math.floor(score / 60) + starsGot + 1, 1, 20);
        isRecord = RA.save.payout('hopper', score, starsEarned);
        if (score >= 800) RA.save.unlock('high');
        RA.celebrate(resultStars, isRecord);
      }

      return {
        music: 'hopper',

        debug: function () {
          return {
            state: state, score: score, starsGot: starsGot, rescues: rescues,
            camY: Math.round(camY),
            px: player && Math.round(player.x), py: player && Math.round(player.y),
            vy: player && Math.round(player.vy),
            vx: player && Math.round(player.vx),
            plats: plats.map(function (p) {
              return { x: Math.round(p.x), y: Math.round(p.y), w: p.w, kind: p.kind };
            })
          };
        },

        enter: function () {
          t = 0; stateT = 0; state = 'intro';
          best = RA.save.best('hopper');
          reset();
        },

        update: function (dt) {
          t += dt; stateT += dt;
          if (state !== 'play') return;

          /* ---- steering ---- */
          var dir = RA.input.axisX();
          if (!dir && RA.input.pointer.down) {
            dir = RA.input.pointer.x < RA.W / 2 ? -1 : 1;
          }
          if (dir) {
            player.vx += dir * MOVE_ACC * dt;
            player.face = dir;
          } else {
            player.vx = U.approach(player.vx, 0, 620 * dt);
          }
          player.vx = U.clamp(player.vx, -MAX_VX, MAX_VX);

          /* ---- physics ---- */
          player.vy += GRAVITY * dt;
          player.x += player.vx * dt;
          player.y += player.vy * dt;

          /* wrap around the sides — forgiving and fun */
          if (player.x < -10) player.x = RA.W + 8;
          if (player.x > RA.W + 10) player.x = -8;

          /* ---- moving platforms ---- */
          for (var m = 0; m < plats.length; m++) {
            var mp = plats[m];
            if (mp.vx) {
              mp.x += mp.vx * dt;
              if (mp.x < 4) { mp.x = 4; mp.vx = Math.abs(mp.vx); }
              if (mp.x + mp.w > RA.W - 4) { mp.x = RA.W - 4 - mp.w; mp.vx = -Math.abs(mp.vx); }
            }
            if (mp.springT > 0) mp.springT = Math.max(0, mp.springT - dt);
          }

          /* ---- landing ---- */
          if (player.vy > 0) {
            for (var i = 0; i < plats.length; i++) {
              var p = plats[i];
              var feet = player.y + player.h / 2;
              if (feet > p.y - 2 && feet < p.y + 10 &&
                  player.x + 5 > p.x && player.x - 5 < p.x + p.w) {
                var spring = p.kind === 'spring';
                player.vy = spring ? SPRING_V : JUMP_V;
                player.y = p.y - player.h / 2 - 1;
                if (spring) { p.springT = 0.3; RA.audio.sfx('bounce'); RA.fx.shake(3, 0.18); }
                else RA.audio.sfx('jump');
                RA.fx.burst(player.x, p.y + 2, {
                  count: spring ? 14 : 6,
                  colors: ['#ffffff', '#e8ecff', '#c3cde0'],
                  speedMin: 18, speedMax: spring ? 90 : 46,
                  arcFrom: 0, arcTo: Math.PI, gravity: 80
                });
                break;
              }
            }
          }

          /* ---- camera + score ---- */
          var want = player.y - RA.H * CAM_ANCHOR;
          if (want < camY) camY = want;
          var up = startY - player.y;
          if (up > maxUp) {
            maxUp = up;
            var newScore = Math.floor(maxUp / 6);
            if (newScore > score) {
              if (Math.floor(newScore / 100) > Math.floor(score / 100)) {
                RA.fx.popText(newScore - (newScore % 100) + 'M!', RA.W / 2, 70,
                              { color: C.gold, scale: 3 });
                RA.audio.sfx('powerup');
              }
              score = newScore;
            }
          }

          /* ---- generate / cull ---- */
          while (topGen > camY - 140) generateRow();
          for (var c = plats.length - 1; c >= 0; c--) {
            if (plats[c].y > camY + RA.H + 60) plats.splice(c, 1);
          }
          for (var k = pickups.length - 1; k >= 0; k--) {
            var pk = pickups[k];
            if (pk.taken > 0) {
              pk.taken += dt * 3;
              if (pk.taken > 1) pickups.splice(k, 1);
              continue;
            }
            if (pk.y > camY + RA.H + 60) { pickups.splice(k, 1); continue; }
            if (Math.abs(pk.x - player.x) < 12 && Math.abs(pk.y - player.y) < 14) {
              pk.taken = 0.001;
              starsGot++;
              RA.audio.sfx('star');
              RA.fx.popText('+1', pk.x, pk.y - 10, { color: C.gold, scale: 2 });
              RA.fx.burst(pk.x, pk.y, {
                count: 16, colors: ['#ffd45c', '#fff0bd', '#ffffff'],
                speedMin: 25, speedMax: 90
              });
            }
          }

          /* trail puffs while rising fast */
          puffT -= dt;
          if (player.vy < -260 && puffT <= 0) {
            puffT = 0.05;
            RA.fx.emit({
              x: player.x + U.rand(-4, 4), y: player.y + 8,
              vx: U.rand(-8, 8), vy: U.rand(10, 30),
              life: 0.35, size: 2, color: '#ffffff', gravity: 0
            });
          }

          /* ---- fall out ----
             The first falls are caught by a balloon rather than ending the
             run. A child learns the controls from the recovery; ending it
             at the first mistake teaches nothing and just stings.        */
          if (player.y - camY > RA.H + 30) {
            if (rescues > 0) {
              rescues--;
              /* find the highest platform that is still on screen */
              var catcher = null;
              for (var ri = 0; ri < plats.length; ri++) {
                var rp = plats[ri];
                var sy = rp.y - camY;
                if (sy > 40 && sy < RA.H - 20 && (!catcher || rp.y > catcher.y)) catcher = rp;
              }
              if (catcher) {
                player.x = catcher.x + catcher.w / 2;
                player.y = catcher.y - player.h / 2 - 1;
              } else {
                player.x = RA.W / 2;
                player.y = camY + RA.H * 0.5;
              }
              player.vx = 0;
              player.vy = JUMP_V;
              rescueT = 1.2;
              RA.audio.sfx('powerup');
              RA.fx.popText('SAVED!', player.x, player.y - camY - 22,
                            { color: C.gold, scale: 3 });
              RA.fx.burst(player.x, player.y - camY, {
                count: 20, colors: ['#ff9ec4', '#ffd45c', '#ffffff'],
                speedMin: 30, speedMax: 100
              });
            } else {
              die();
            }
          }

          player.frame = player.vy < 0 ? 0 : 1;
        },

        draw: function (ctx) {
          /* ---- layered sky by altitude ---- */
          var band = U.clamp(score / BAND_HEIGHT, 0, BANDS.length - 1.001);
          var bi = Math.floor(band), bf = band - bi;
          RA.bg.sky(ctx, BANDS[bi]);
          if (bf > 0.01) {
            ctx.globalAlpha = bf;
            RA.bg.sky(ctx, BANDS[Math.min(bi + 1, BANDS.length - 1)]);
            ctx.globalAlpha = 1;
          }
          if (band > 2.4) {
            ctx.globalAlpha = U.clamp((band - 2.4) / 1.2, 0, 1);
            RA.bg.stars(ctx, t, { height: RA.H });
            ctx.globalAlpha = 1;
          }

          /* parallax clouds drifting down as she climbs */
          var par = (-camY * 0.25) % 300;
          ctx.globalAlpha = 0.5;
          RA.bg.clouds(ctx, t * 0.5 + par * 0.02, { count: 4, speed: 3, top: 20, band: 180, alpha: 0.5 });
          ctx.globalAlpha = 1;

          /* ---- platforms ---- */
          for (var i = 0; i < plats.length; i++) {
            var p = plats[i];
            var sy = p.y - camY;
            if (sy < -20 || sy > RA.H + 20) continue;
            drawPlatform(ctx, p, p.x, sy);
          }

          /* ---- pickups ---- */
          for (var k = 0; k < pickups.length; k++) {
            var pk = pickups[k];
            var py = pk.y - camY;
            if (py < -20 || py > RA.H + 20) continue;
            if (pk.taken > 0) {
              RA.spr.drawC(ctx, 'star', pk.x, py - pk.taken * 14,
                           { alpha: 1 - pk.taken, scale: 1 + pk.taken });
            } else {
              RA.spr.drawC(ctx, 'star', pk.x, py + Math.sin(t * 3 + pk.ph) * 3, {});
            }
          }

          /* ---- player ---- */
          if (state !== 'intro') {
            var sprName = player.vy < 0 ? 'girl_jump' : 'girl_fall';
            var py2 = player.y - camY;
            RA.spr.drawC(ctx, sprName, player.x, py2, { flipX: player.face < 0 });
            /* wrap ghost so she never visually vanishes at the edges */
            if (player.x < 14) RA.spr.drawC(ctx, sprName, player.x + RA.W, py2, { flipX: player.face < 0 });
            if (player.x > RA.W - 14) RA.spr.drawC(ctx, sprName, player.x - RA.W, py2, { flipX: player.face < 0 });
          }

          /* ---- HUD ---- */
          ctx.fillStyle = 'rgba(18,19,43,0.78)';
          ctx.fillRect(0, 0, RA.W, 22);
          RA.font.draw(ctx, score + 'M', 8, 7, {
            scale: 2, color: C.cream, outline: true, outlineColor: C.ink
          });
          RA.spr.draw(ctx, 'star_small', RA.W / 2 - 20, 8, {});
          RA.font.draw(ctx, starsGot, RA.W / 2 - 8, 8, { scale: 2, color: C.gold });

          /* balloons left = falls that will be caught */
          for (var rb = 0; rb < rescues; rb++) {
            RA.spr.draw(ctx, 'heart', RA.W / 2 + 26 + rb * 10, 8, {});
          }
          RA.font.draw(ctx, 'BEST ' + Math.max(best, score) + 'M', RA.W - 8, 9, {
            scale: 1, align: 'right', color: C.mist
          });

          /* danger marker when she's low on screen */
          if (state === 'play') {
            var low = (player.y - camY) / RA.H;
            if (low > 0.82) {
              ctx.fillStyle = 'rgba(242,112,92,' + ((low - 0.82) / 0.18 * 0.4) + ')';
              ctx.fillRect(0, RA.H - 30, RA.W, 30);
            }
          }

          RA.ui.begin({ nav: state !== 'play' });

          if (state === 'intro') {
            ctx.fillStyle = 'rgba(18,19,43,0.6)';
            ctx.fillRect(0, 0, RA.W, RA.H);
            RA.ui.panel(ctx, 84, 46, 312, 156, { fill: C.ink2, highlight: C.ink3 });
            RA.font.draw(ctx, 'SKY HOPPER', RA.W / 2, 56, {
              scale: 4, align: 'center', color: C.sky, outline: true, outlineColor: C.ink
            });
            RA.spr.drawC(ctx, 'girl_jump', 128, 108, { scale: 2 });
            RA.font.wrap(ctx, 'SHE JUMPS BY HERSELF. YOU JUST STEER!',
                         162, 92, 210, { scale: 2, color: C.cream });
            RA.font.draw(ctx, 'TAP LEFT OR RIGHT SIDE, OR USE < >', RA.W / 2, 140, {
              scale: 1, align: 'center', color: C.mist
            });
            RA.font.draw(ctx, 'GRAB STARS. GO AS HIGH AS YOU CAN!', RA.W / 2, 152, {
              scale: 1, align: 'center', color: C.gold
            });
            if (RA.ui.button(ctx, RA.W / 2 - 60, 168, 120, 26, 'CLIMB!',
                             { color: C.green, scale: 2 })) {
              state = 'play'; stateT = 0; reset();
            }
            if (RA.ui.button(ctx, 6, 4, 44, 20, '<', { color: C.grape, scale: 1, sound: 'back' })) {
              RA.go('hub');
            }
            if (RA.input.justPressed('back')) RA.go('hub');

          } else if (state === 'over') {
            var r = RA.ui.results(ctx, {
              t: stateT,
              title: score >= 500 ? 'SO HIGH!' : score >= 200 ? 'GREAT CLIMB!' : 'NICE TRY!',
              scoreLabel: 'HEIGHT REACHED',
              score: score,
              stars: resultStars,
              starsEarned: starsEarned,
              record: isRecord,
              lines: ['STARS GRABBED ' + starsGot]
            });
            if (r === 'again') { state = 'play'; stateT = 0; reset(); }
            else if (r === 'home') RA.go('hub');

          } else {
            if (RA.ui.button(ctx, 430, 26, 44, 20, '<',
                             { color: C.grape, scale: 1, sound: 'back' })) RA.go('hub');
            if (RA.input.justPressed('back')) RA.go('hub');
          }
          RA.ui.end();
        }
      };
    }
  });

})();

</script>
<script>
/* ===== js/games/maze.js ===== */
/* =====================================================================
   games/maze.js — STAR MAZE

   Endless procedurally generated hedge mazes (recursive backtracker).
   Collect every star, then the gate opens. A sleepy bee wanders the
   corridors — bumping it only costs a star, never a life, so getting
   lost is never punishing.
   ===================================================================== */
(function () {
  'use strict';

  var RA = window.RA;
  var U = RA.util;
  var C = RA.C;

  var TOP = 24;                     // HUD height
  var MOVE_SPEED = 6.2;             // cells per second

  /* ------------------------------------------------- maze generation */
  function generate(cw, ch, rnd) {
    var W = cw * 2 + 1, H = ch * 2 + 1;
    var grid = [];
    var x, y;
    for (y = 0; y < H; y++) {
      grid[y] = [];
      for (x = 0; x < W; x++) grid[y][x] = 1;      // 1 = wall
    }

    var visited = [];
    for (y = 0; y < ch; y++) { visited[y] = []; for (x = 0; x < cw; x++) visited[y][x] = false; }

    var stack = [{ x: 0, y: 0 }];
    visited[0][0] = true;
    grid[1][1] = 0;

    var DIRS = [[0, -1], [1, 0], [0, 1], [-1, 0]];

    while (stack.length) {
      var cur = stack[stack.length - 1];
      var options = [];
      for (var d = 0; d < 4; d++) {
        var nx = cur.x + DIRS[d][0], ny = cur.y + DIRS[d][1];
        if (nx >= 0 && nx < cw && ny >= 0 && ny < ch && !visited[ny][nx]) options.push(d);
      }
      if (!options.length) { stack.pop(); continue; }
      var pickD = options[Math.floor(rnd() * options.length)];
      var tx = cur.x + DIRS[pickD][0], ty = cur.y + DIRS[pickD][1];
      visited[ty][tx] = true;
      grid[ty * 2 + 1][tx * 2 + 1] = 0;
      grid[cur.y * 2 + 1 + DIRS[pickD][1]][cur.x * 2 + 1 + DIRS[pickD][0]] = 0;
      stack.push({ x: tx, y: ty });
    }

    /* knock a few extra holes so there are loops, not just one path —
       far less frustrating for a small child */
    var extras = Math.floor(cw * ch * 0.06);
    for (var e = 0; e < extras; e++) {
      var rx = 1 + Math.floor(rnd() * (W - 2));
      var ry = 1 + Math.floor(rnd() * (H - 2));
      if ((rx % 2) === (ry % 2)) continue;
      grid[ry][rx] = 0;
    }
    return { grid: grid, W: W, H: H, cw: cw, ch: ch };
  }

  function openCells(maze) {
    var list = [];
    for (var y = 1; y < maze.H - 1; y++) {
      for (var x = 1; x < maze.W - 1; x++) {
        if (maze.grid[y][x] === 0 && (x % 2) === 1 && (y % 2) === 1) list.push({ x: x, y: y });
      }
    }
    return list;
  }

  /* ================================================================== */
  RA.registerGame({
    id: 'maze',
    title: 'STAR MAZE',
    color: '#1d7a45',
    artBg: '#3fae5c',
    icon: 'maze_gate',
    bestLabel: function (b) { return 'BEST LEVEL ' + b; },

    /* A real little maze, not noise: this layout is a hand-checked
       11x5 corridor plan, and the walker follows the open path. */
    preview: (function () {
      var PLAN = [
        '###########',
        '#.........#',
        '#.###.###.#',
        '#...#...#.#',
        '###########'
      ];
      var PATH = [[1,1],[2,1],[3,1],[4,1],[5,1],[6,1],[7,1],[8,1],[9,1],[9,2],[9,3],[8,3],[7,3],[6,3],[5,3]];
      return function (ctx, x, y, w, h, t) {
        var ts = Math.floor(Math.min(w / 11, h / 5));
        var ox = Math.round(x + (w - ts * 11) / 2);
        var oy = Math.round(y + (h - ts * 5) / 2);
        for (var gy = 0; gy < 5; gy++) {
          for (var gx = 0; gx < 11; gx++) {
            var px = ox + gx * ts, py = oy + gy * ts;
            if (PLAN[gy].charAt(gx) === '#') {
              ctx.fillStyle = '#1d7a45'; ctx.fillRect(px, py, ts, ts);
              ctx.fillStyle = '#3fae5c'; ctx.fillRect(px, py, ts, ts - 1);
              ctx.fillStyle = '#8fe07a'; ctx.fillRect(px + 1, py + 1, ts - 2, 1);
            } else {
              ctx.fillStyle = ((gx + gy) & 1) ? '#e6fbd6' : '#d8f7c0';
              ctx.fillRect(px, py, ts, ts);
            }
          }
        }
        RA.spr.drawC(ctx, 'star', ox + 5.5 * ts, oy + 3.5 * ts + Math.sin(t * 3) * 1.5, {});
        RA.spr.drawC(ctx, 'maze_gate', ox + 9.5 * ts, oy + 1.5 * ts, {});
        var step = PATH[Math.floor(t * 3) % PATH.length];
        var nxt = PATH[(Math.floor(t * 3) + 1) % PATH.length];
        var f = (t * 3) % 1;
        RA.spr.drawC(ctx, 'girl_idle',
          ox + (step[0] + (nxt[0] - step[0]) * f + 0.5) * ts,
          oy + (step[1] + (nxt[1] - step[1]) * f + 0.5) * ts, { scale: 0.7 });
      };
    })(),

    scene: function () {
      var state = 'intro';      // intro | play | cleared | over
      var t = 0, stateT = 0;
      var level = 1, maze = null, ts = 12, ox = 0, oy = 0;
      var player = null, stars = [], gate = null, bee = null;
      var collected = 0, moves = 0, levelT = 0, graceT = 0;
      var resultStars = 0, starsEarned = 0, isRecord = false;
      var held = { x: 0, y: 0 };

      function buildLevel(n) {
        level = n;
        /* Capped so the tiles stay legible and a level never turns into a
           two-minute walk; the old build shrank to 15px tiles by level 12
           and asked for ~32s of pure movement. */
        var mcfg = RA.tune.get('maze');
        var cw = U.clamp(6 + Math.floor(n / 2), 6, mcfg.cwMax);
        var ch = U.clamp(3 + Math.floor(n / 3), 3, mcfg.chMax);
        maze = generate(cw, ch, U.rng(1337 + n * 7919 + Math.floor(Math.random() * 1000)));

        var availW = RA.W - 16, availH = RA.H - TOP - 12;
        ts = Math.max(8, Math.floor(Math.min(availW / maze.W, availH / maze.H)));
        ox = Math.round((RA.W - maze.W * ts) / 2);
        oy = Math.round(TOP + (availH - maze.H * ts) / 2);

        player = { cx: 1, cy: 1, x: 1, y: 1, tx: 1, ty: 1, moving: false, face: 1, anim: 0 };

        var cells = openCells(maze).filter(function (c) {
          return !(c.x === 1 && c.y === 1);
        });
        cells = U.shuffle(cells);

        var starCount = Math.min(cells.length - 1,
                                 mcfg.starBase + Math.floor(n / mcfg.starGrow));
        stars = cells.slice(0, starCount).map(function (c) {
          return { cx: c.x, cy: c.y, taken: false, ph: Math.random() * 6 };
        });

        /* gate goes as far from the start as we can manage */
        var far = cells[cells.length - 1];
        for (var i = 0; i < cells.length; i++) {
          if (cells[i].x + cells[i].y > far.x + far.y) far = cells[i];
        }
        gate = { cx: far.x, cy: far.y, open: false, t: 0 };

        /* The bee only shows up once she has the hang of it, and it always
           starts as far from her as the maze allows. */
        bee = null;
        graceT = 0;
        if (n >= mcfg.beeFrom) {
          var bc = farthestCellFrom(1, 1);
          if (bc.d >= 4) {
            bee = { x: bc.x, y: bc.y, tx: bc.x, ty: bc.y, moving: false, cool: 0, doze: 0 };
          }
        }

        collected = 0; moves = 0; levelT = 0;
      }

      function walkable(cx, cy) {
        return cx >= 0 && cy >= 0 && cx < maze.W && cy < maze.H && maze.grid[cy][cx] === 0;
      }

      /* Breadth-first distances from a cell, in steps through the maze —
         straight-line distance is meaningless with walls in the way. */
      function distancesFrom(sx, sy) {
        var dist = [];
        for (var y = 0; y < maze.H; y++) {
          dist[y] = [];
          for (var x = 0; x < maze.W; x++) dist[y][x] = -1;
        }
        if (!walkable(sx, sy)) return dist;
        dist[sy][sx] = 0;
        var queue = [[sx, sy]], head = 0;
        var D = [[1, 0], [-1, 0], [0, 1], [0, -1]];
        while (head < queue.length) {
          var c = queue[head++];
          for (var d = 0; d < 4; d++) {
            var nx = c[0] + D[d][0], ny = c[1] + D[d][1];
            if (!walkable(nx, ny) || dist[ny][nx] !== -1) continue;
            dist[ny][nx] = dist[c[1]][c[0]] + 1;
            queue.push([nx, ny]);
          }
        }
        return dist;
      }

      /** The reachable cell furthest (in steps) from cx,cy. */
      function farthestCellFrom(cx, cy) {
        var dist = distancesFrom(cx, cy);
        var best = null, bestD = -1;
        for (var y = 1; y < maze.H - 1; y++) {
          for (var x = 1; x < maze.W - 1; x++) {
            if (dist[y][x] > bestD) { bestD = dist[y][x]; best = { x: x, y: y, d: bestD }; }
          }
        }
        return best || { x: 1, y: 1, d: 0 };
      }

      function tryMove(dx, dy) {
        if (player.moving) return;
        var nx = player.cx + dx, ny = player.cy + dy;
        if (!walkable(nx, ny)) return;
        player.tx = nx; player.ty = ny;
        player.moving = true;
        if (dx) player.face = dx;
        moves++;
        RA.audio.sfx('step');
      }

      function finishLevel() {
        state = 'cleared'; stateT = 0;
        RA.audio.sfx('win');
        RA.fx.confetti(70);
        var earned = 2 + level;
        RA.save.addStars(earned);
        RA.save.markPlayed('maze');
        RA.save.setBest('maze', level);
        if (level >= 5) RA.save.unlock('explorer');
      }

      function endRun() {
        state = 'over'; stateT = 0;
        resultStars = level >= 8 ? 3 : level >= 4 ? 2 : 1;
        starsEarned = U.clamp(level * 2, 1, 20);
        isRecord = RA.save.payout('maze', level, starsEarned);
        RA.celebrate(resultStars, isRecord);
      }

      return {
        music: 'maze',

        debug: function () {
          return {
            state: state, level: level,
            collected: collected, stars: stars.length,
            gateOpen: gate && gate.open,
            cx: player && player.cx, cy: player && player.cy,
            moving: player && player.moving,
            ox: ox, oy: oy, ts: ts, W: maze && maze.W, H: maze && maze.H,
            grid: maze && maze.grid,
            starPos: stars.map(function (s) { return [s.cx, s.cy, s.taken]; }),
            gatePos: gate && [gate.cx, gate.cy],
            graceT: +graceT.toFixed(2),
            bee: bee ? { x: +bee.x.toFixed(2), y: +bee.y.toFixed(2), doze: +bee.doze.toFixed(2) } : null
          };
        },

        enter: function () { t = 0; stateT = 0; state = 'intro'; buildLevel(1); },

        update: function (dt) {
          t += dt; stateT += dt;
          if (state !== 'play') return;
          levelT += dt;

          /* ---- smooth grid movement ---- */
          if (player.moving) {
            var sp = MOVE_SPEED * dt;
            player.x = U.approach(player.x, player.tx, sp);
            player.y = U.approach(player.y, player.ty, sp);
            player.anim += dt * 12;
            if (player.x === player.tx && player.y === player.ty) {
              player.cx = player.tx; player.cy = player.ty;
              player.moving = false;
            }
          } else {
            /* keyboard */
            var dx = 0, dy = 0;
            if (RA.input.isDown('left')) dx = -1;
            else if (RA.input.isDown('right')) dx = 1;
            else if (RA.input.isDown('up')) dy = -1;
            else if (RA.input.isDown('down')) dy = 1;

            /* touch: hold anywhere, we steer toward the finger */
            if (!dx && !dy && RA.input.pointer.down) {
              var pxp = ox + player.cx * ts + ts / 2;
              var pyp = oy + player.cy * ts + ts / 2;
              var ddx = RA.input.pointer.x - pxp, ddy = RA.input.pointer.y - pyp;
              if (Math.abs(ddx) > Math.abs(ddy)) { if (Math.abs(ddx) > 5) dx = U.sign(ddx); }
              else if (Math.abs(ddy) > 5) dy = U.sign(ddy);
            }
            if (dx || dy) tryMove(dx, dy);
          }

          /* ---- stars ---- */
          for (var i = 0; i < stars.length; i++) {
            var s = stars[i];
            if (s.taken) continue;
            if (s.cx === player.cx && s.cy === player.cy) {
              s.taken = true;
              collected++;
              RA.audio.sfx('coin');
              RA.fx.burst(ox + s.cx * ts + ts / 2, oy + s.cy * ts + ts / 2, {
                count: 14, colors: ['#ffd45c', '#fff0bd', '#ffffff'], speedMin: 20, speedMax: 80
              });
              RA.fx.popText('+1', ox + s.cx * ts + ts / 2, oy + s.cy * ts - 4,
                            { color: C.gold, scale: 1 });
              if (collected === stars.length) {
                gate.open = true;
                RA.audio.sfx('unlock');
                RA.fx.popText('GATE OPEN!', RA.W / 2, TOP + 10, { color: C.leaf, scale: 2 });
              }
            }
          }

          /* ---- gate ---- */
          if (gate.open) {
            gate.t += dt;
            if (player.cx === gate.cx && player.cy === gate.cy) finishLevel();
          }

          /* ---- bee ----
             Rules that keep this fair for a small child:
               - it can never step onto the cell she is standing on, so it
                 cannot corner her in a dead end
               - after a bump she gets a long grace period and the bee dozes
               - she is never teleported; being yanked back to the start of a
                 maze is a miserable punishment at this age
               - the bee retreats to the furthest reachable cell, measured in
                 steps through the maze, not straight-line distance          */
          if (graceT > 0) graceT = Math.max(0, graceT - dt);

          if (bee) {
            if (bee.doze > 0) {
              bee.doze = Math.max(0, bee.doze - dt);
            } else if (bee.moving) {
              var bs = 2.3 * dt;
              bee.x = U.approach(bee.x, bee.tx, bs);
              bee.y = U.approach(bee.y, bee.ty, bs);
              if (bee.x === bee.tx && bee.y === bee.ty) bee.moving = false;
            } else {
              bee.cool -= dt;
              if (bee.cool <= 0) {
                bee.cool = U.rand(0.25, 0.6);
                var opts = [];
                var D = [[1, 0], [-1, 0], [0, 1], [0, -1]];
                for (var d = 0; d < 4; d++) {
                  var nx2 = Math.round(bee.x) + D[d][0], ny2 = Math.round(bee.y) + D[d][1];
                  if (!walkable(nx2, ny2)) continue;
                  if (nx2 === player.cx && ny2 === player.cy) continue;   // never land on her
                  opts.push([nx2, ny2]);
                }
                if (opts.length) {
                  /* Shy: if she is close, prefer whichever way opens the gap.
                     Otherwise it would be able to park in a corridor she has
                     to walk through and tax her every single time. */
                  var pd = distancesFrom(player.cx, player.cy);
                  var here = pd[Math.round(bee.y)] ? pd[Math.round(bee.y)][Math.round(bee.x)] : 99;
                  if (here >= 0 && here <= 2) {
                    var bestOpt = opts[0], bestD = -1;
                    for (var oi = 0; oi < opts.length; oi++) {
                      var od = pd[opts[oi][1]][opts[oi][0]];
                      if (od > bestD) { bestD = od; bestOpt = opts[oi]; }
                    }
                    bee.tx = bestOpt[0]; bee.ty = bestOpt[1];
                  } else {
                    var o = U.pick(opts);
                    bee.tx = o[0]; bee.ty = o[1];
                  }
                  bee.moving = true;
                }
              }
            }

            var touching = Math.abs(bee.x - player.x) < 0.6 &&
                           Math.abs(bee.y - player.y) < 0.6;

            if (touching && graceT <= 0 && bee.doze <= 0) {
              graceT = 2.6;
              bee.doze = 2.6;

              if (collected > 0) {
                collected--;
                gate.open = false;
                for (var q = stars.length - 1; q >= 0; q--) {
                  if (stars[q].taken) { stars[q].taken = false; break; }
                }
                RA.fx.popText('OOPS! LOST A STAR', ox + player.x * ts + ts / 2,
                              oy + player.y * ts - 8, { color: C.coral, scale: 2 });
              } else {
                RA.fx.popText('BUZZ OFF!', ox + player.x * ts + ts / 2,
                              oy + player.y * ts - 8, { color: C.gold, scale: 2 });
              }

              RA.audio.sfx('wrong');
              RA.fx.shake(3, 0.18);
              RA.fx.burst(ox + bee.x * ts + ts / 2, oy + bee.y * ts + ts / 2, {
                count: 10, colors: ['#ffd45c', '#fff0bd'], speedMin: 20, speedMax: 60
              });

              /* send it as far away as the maze allows */
              var away = farthestCellFrom(player.cx, player.cy);
              bee.x = bee.tx = away.x;
              bee.y = bee.ty = away.y;
              bee.moving = false;
              bee.cool = 0.8;
            }
          }
        },

        draw: function (ctx) {
          RA.bg.sky(ctx, ['#8fd8ff', '#bff0ff', '#d8f7c0']);

          if (maze) {
            /* maze floor */
            ctx.fillStyle = '#d8f7c0';
            ctx.fillRect(ox, oy, maze.W * ts, maze.H * ts);

            for (var y = 0; y < maze.H; y++) {
              for (var x = 0; x < maze.W; x++) {
                var px = ox + x * ts, py = oy + y * ts;
                if (maze.grid[y][x] === 1) {
                  /* hedge block, shaded top and bottom */
                  ctx.fillStyle = '#1d7a45'; ctx.fillRect(px, py, ts, ts);
                  ctx.fillStyle = '#3fae5c'; ctx.fillRect(px, py, ts, ts - 2);
                  ctx.fillStyle = '#8fe07a';
                  ctx.fillRect(px + 1, py + 1, ts - 2, 2);
                  ctx.fillStyle = '#1d7a45';
                  ctx.fillRect(px + (x * 3 + y * 5) % Math.max(1, ts - 2), py + 3, 2, 2);
                } else {
                  ctx.fillStyle = ((x + y) & 1) ? '#e6fbd6' : '#d8f7c0';
                  ctx.fillRect(px, py, ts, ts);
                }
              }
            }

            /* gate */
            var gx = ox + gate.cx * ts, gy = oy + gate.cy * ts;
            if (gate.open) {
              var glow = 0.5 + 0.5 * Math.sin(t * 5);
              ctx.globalAlpha = 0.35 + glow * 0.3;
              ctx.fillStyle = '#ffd45c';
              ctx.fillRect(gx - 2, gy - 2, ts + 4, ts + 4);
              ctx.globalAlpha = 1;
            }
            RA.spr.drawC(ctx, 'maze_gate', gx + ts / 2, gy + ts / 2,
                         { scale: Math.max(1, ts / 10), alpha: gate.open ? 1 : 0.5 });

            /* stars */
            for (var i = 0; i < stars.length; i++) {
              var s = stars[i];
              if (s.taken) continue;
              RA.spr.drawC(ctx, 'star', ox + s.cx * ts + ts / 2,
                           oy + s.cy * ts + ts / 2 + Math.sin(t * 3 + s.ph) * 2, {});
            }

            /* bee — visibly asleep during the grace period */
            if (bee) {
              var dozing = bee.doze > 0;
              RA.spr.drawC(ctx, 'sleepy_bee', ox + bee.x * ts + ts / 2,
                           oy + bee.y * ts + ts / 2 + Math.sin(t * (dozing ? 2 : 6)) * 1.5,
